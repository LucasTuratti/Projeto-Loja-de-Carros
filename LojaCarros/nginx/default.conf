server {server {

    listen 80;    listen 80;

    server_name localhost;    server_name localhost;



    root /usr/share/nginx/html;    # Configurações de log para debug

    index index.html;    error_log /var/log/nginx/error.log debug;

    access_log /var/log/nginx/access.log combined;

    # Configurações de log para debug

    error_log /var/log/nginx/error.log debug;    # Frontend

    access_log /var/log/nginx/access.log combined;    root /usr/share/nginx/html;

    index index.html;

    # Rota principal para o frontend

    location / {    # Configuração CORS global

        try_files $uri $uri/ /index.html;    add_header 'Access-Control-Allow-Origin' '*' always;

    }    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;

    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

    # Rota para a API
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/php/api.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass php:9000;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }

    # Métricas do Nginx
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass php:9000;

        if ($request_method = 'OPTIONS') {        fastcgi_param SCRIPT_FILENAME /var/www/php/api.php;

            add_header 'Access-Control-Max-Age' 1728000;        fastcgi_param PATH_INFO $fastcgi_path_info;

            add_header 'Content-Type' 'text/plain charset=UTF-8';    }

            add_header 'Content-Length' 0;

            return 204;    # Bloquear acesso a arquivos .ht

        }    location ~ /\.ht {

    }        deny all;

    }

    # Bloquear acesso a arquivos .ht

    location ~ /\.ht {    # Responder a requisições OPTIONS para CORS

        deny all;    if ($request_method = 'OPTIONS') {

    }        add_header 'Access-Control-Allow-Origin' '*';

}        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}
}
