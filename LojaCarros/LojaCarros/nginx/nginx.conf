events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Configurações de log para debug
        error_log /var/log/nginx/error.log debug;
        access_log /var/log/nginx/access.log combined;

        # Rota principal para o frontend
        location / {
            try_files $uri $uri/ /index.html;
        }

    # Rota para a API
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/php/api.php;
        fastcgi_param SCRIPT_NAME /api/cars;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass php:9000;
        fastcgi_intercept_errors off;
        fastcgi_buffering off;
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # Bloquear acesso a arquivos .ht
        location ~ /\.ht {
            deny all;
        }
    }
}